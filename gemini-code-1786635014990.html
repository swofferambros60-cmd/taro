<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霍格沃茨秘境塔罗 | 魔法指引</title>
    <style>
        /* 迎合小红书审美的复古奶油风 */
        :root {
            --bg-color: #FDFBF7;
            --text-main: #5C4D43;
            --text-sub: #8C7B70;
            --gold-accent: #D4AF37;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            background-image: radial-gradient(circle at center, #ffffff 0%, #FDFBF7 100%);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .header p {
            font-size: 14px;
            color: var(--text-sub);
            font-style: italic;
        }

        /* 塔罗牌布局区域 */
        .tarot-spread {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 900px;
        }

        /* 3D翻转卡片容器 */
        .card-container {
            width: 200px;
            height: 340px;
            perspective: 1000px; /* 赋予3D深度 */
            cursor: pointer;
            margin-bottom: 20px;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 带有弹性效果的翻转 */
            transform-style: preserve-3d;
        }

        /* 触发翻转的类 */
        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(92, 77, 67, 0.15);
            overflow: hidden;
        }

        /* 牌背设计（未翻开时） */
        .card-front {
            background: linear-gradient(135deg, #2C3539, #1A1D20);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--gold-accent);
        }

        .card-front::after {
            content: '✨';
            font-size: 40px;
            color: var(--gold-accent);
            opacity: 0.8;
        }

        /* 牌面设计（翻开后） */
        .card-back {
            transform: rotateY(180deg);
            background-color: #fff;
        }

        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 保证图片铺满且不变形 */
        }

        /* 卡片底部文字（例如：过去、现在、未来） */
        .card-label {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-sub);
            letter-spacing: 1px;
        }

        /* 重新洗牌按钮 */
        .btn-shuffle {
            margin-top: 50px;
            padding: 12px 36px;
            font-size: 16px;
            color: #fff;
            background-color: var(--text-main);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(92, 77, 67, 0.2);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-shuffle:hover {
            background-color: var(--gold-accent);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Hogwarts Secret Realm Tarot</h1>
        <p>✨ 冥想你的问题，依次点击卡牌翻开命运的指引 ✨</p>
    </div>

    <!-- 经典三牌阵：过去、现在、未来 -->
    <div class="tarot-spread" id="tarot-spread">
        <div>
            <div class="card-container" onclick="flipCard(this)">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back"><img src="" alt="Tarot Card" class="tarot-img"></div>
                </div>
            </div>
            <div class="card-label">Past Journey</div>
        </div>
        <div>
            <div class="card-container" onclick="flipCard(this)">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back"><img src="" alt="Tarot Card" class="tarot-img"></div>
                </div>
            </div>
            <div class="card-label">Present Heart</div>
        </div>
        <div>
            <div class="card-container" onclick="flipCard(this)">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back"><img src="" alt="Tarot Card" class="tarot-img"></div>
                </div>
            </div>
            <div class="card-label">Future Path</div>
        </div>
    </div>

    <button class="btn-shuffle" onclick="shuffleAndReset()">重新洗牌 (Shuffle)</button>

    <script>
        // 包含你提供的所有哈利波特塔罗牌图片文件名
        const allCards = [
            'DEATH.jfif',
            'JUDGEMENT.jfif',
            'JUSTICE.jfif',
            'STRENGTH.jfif',
            'TEMPERANCE.jfif',
            'THE CHARIOT.jfif',
            'THE DEVIL.jfif',
            'THE FATHER.jfif',
            'THE FOOL.jfif',
            'THE HANGEN MAN.jfif'
        ];

        // Fisher-Yates 洗牌算法，确保完全随机
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // 初始化和重置牌阵
        function shuffleAndReset() {
            // 1. 将所有牌翻盖回去
            const containers = document.querySelectorAll('.card-container');
            containers.forEach(container => {
                container.classList.remove('flipped');
            });

            // 延迟一点时间等翻转动画结束后再替换图片，体验更好
            setTimeout(() => {
                // 2. 打乱数组并抽取前3张（保证不重复）
                const shuffledCards = shuffleArray([...allCards]);
                const selectedCards = shuffledCards.slice(0, 3);

                // 3. 将选中的图片赋值给牌背的 <img> 标签
                const imgElements = document.querySelectorAll('.tarot-img');
                imgElements.forEach((img, index) => {
                    img.src = selectedCards[index];
                });
            }, 400); // 400ms 是等待翻盖动画的时间
        }

        // 点击卡片触发翻转效果
        function flipCard(element) {
            // 如果已经被翻开，就不再触发
            if (!element.classList.contains('flipped')) {
                element.classList.add('flipped');
            }
        }

        // 页面加载时自动洗牌一次
        window.onload = shuffleAndReset;
    </script>
</body>
</html>
