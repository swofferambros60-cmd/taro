<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哈利波特塔罗牌在线占卜</title>
  <style>
    /* 基础样式重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #12121c;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      color: #f39c12;
      margin: 20px 0 10px 0;
      font-size: 24px;
      text-align: center;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }

    /* 塔罗牌卡片 3D 翻转效果 */
    .card-container {
      perspective: 1000px;
      width: 200px;
      height: 340px;
      margin-bottom: 25px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      border: 2px solid #d4af37;
    }

    /* 牌背 */
    .card-back {
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: #d4af37;
    }

    .card-back-pattern {
      width: 80%;
      height: 80%;
      border: 2px dashed #d4af37;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
    }

    /* 牌面 */
    .card-front {
      background: #232334;
      color: #fff;
      transform: rotateY(180deg);
      text-align: center;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: #f1c40f;
      margin-bottom: 6px;
    }

    .card-number {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 12px;
    }

    /* 翻牌按钮 */
    .action-btn {
      background: linear-gradient(135deg, #f39c12, #d35400);
      color: #fff;
      border: none;
      padding: 12px 36px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
      transition: all 0.2s;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(243, 156, 18, 0.6);
    }

    /* 卡牌解读结果面板 */
    .reading-box {
      margin-top: 25px;
      background: #1e1e2d;
      border: 1px solid #33334d;
      border-radius: 12px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
      display: none;
    }

    .reading-box h3 {
      color: #f39c12;
      margin-bottom: 10px;
      font-size: 16px;
      border-bottom: 1px solid #33334d;
      padding-bottom: 6px;
    }

    .reading-box p {
      font-size: 14px;
      line-height: 1.6;
      color: #ccc;
      margin-bottom: 10px;
    }

    /* ---------------------------------------------------- */
    /* 支付解锁弹窗样式                                     */
    /* ---------------------------------------------------- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 320px;
      width: 85%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      color: #333333;
    }

    .modal-content h3 {
      margin-top: 0;
      color: #1a1a1a;
      font-size: 18px;
    }

    .pay-tip {
      font-size: 14px;
      color: #555555;
      margin: 12px 0;
      line-height: 1.4;
    }

    .qr-img {
      width: 220px;
      height: auto;
      border-radius: 8px;
      border: 1px solid #eeeeee;
      margin: 8px 0;
    }

    .pay-note {
      font-size: 12px;
      color: #888888;
      margin: 8px 0 16px 0;
    }

    .pay-btn {
      background-color: #07c160; /* 微信绿 */
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 24px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
    }

    .pay-btn:hover {
      background-color: #06ad56;
    }

    .pay-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <h1>⚡ 霍格沃茨塔罗牌 ⚡</h1>
  <p class="subtitle">抽取你的今日命运与魔法启示</p>

  <!-- 牌面展示区 -->
  <div class="card-container">
    <div class="card" id="tarotCard">
      <!-- 牌背 -->
      <div class="card-face card-back">
        <div class="card-back-pattern">🔮</div>
      </div>
      <!-- 牌面 -->
      <div class="card-face card-front">
        <div class="card-number" id="cardNumber">NO.0</div>
        <div class="card-title" id="cardName">THE FOOL</div>
        <p style="font-size: 12px; color: #888; margin-top: 10px;" id="cardElement">对应元素</p>
      </div>
    </div>
  </div>

  <!-- 翻牌按钮 -->
  <button class="action-btn" onclick="startFlipCard()">开始翻牌 / 抽取卡牌</button>

  <!-- 卡牌解读结果面板 -->
  <div class="reading-box" id="readingBox">
    <h3>✨ 画面对应</h3>
    <p id="elementText"></p>
    <h3>📜 命运解读</h3>
    <p id="meaningText"></p>
  </div>

  <!-- 微信支付解锁弹窗 -->
  <div id="payModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3>🔮 解锁完整塔罗牌解读</h3>
      <p class="pay-tip">请使用微信扫描下方二维码，支付 <strong>≥ 2 元</strong> 即可解锁翻牌及完整卡牌解读。</p>
      
      <!-- 请确保根目录下有 qr.jpg 二维码图片 -->
      <img src="qr.jpg" alt="微信支付二维码" class="qr-img">
      
      <p class="pay-note">支付完成后，点击下方按钮开始翻牌：</p>
      <button id="confirmPayBtn" class="pay-btn">我已支付 ≥ 2 元，立即解锁</button>
    </div>
  </div>

  <script>
    // ====================================================
    // 1. 22 张大阿卡纳全套卡牌数据库
    // ====================================================
    const cards = [
      { id: 0, name: "THE FOOL", cnName: "愚人", element: "九又四分之三站台与推着推车的哈利", meaning: "象征新的开始、纯真、冒险与无限可能性。如同哈利初入魔法世界，怀着盲目而纯粹的勇气踏上未知旅程。" },
      { id: 1, name: "THE WIZARD", cnName: "魔术师 / 巫师", element: "身穿韦斯莱毛衣、手握魔杖施法的哈利·波特", meaning: "象征创造力、行动力、掌控资源与显化。代表拥有改变现状的工具与能力，能够将想法转化为现实。" },
      { id: 2, name: "THE WITCH", cnName: "女祭司 / 女巫", element: "在药膏与书籍间沉思炼药的赫敏·格兰杰", meaning: "象征智慧、潜意识、理性与内在知识。代表冷静分析、对真理的追求以及不外露的强大精神力量。" },
      { id: 3, name: "THE MOTHER", cnName: "女皇 / 母亲", element: "用魔法烹饪、编织毛衣的莫丽·韦斯莱", meaning: "象征丰饶、无条件的爱、滋养与包容。代表物质与情感上的丰盈，以及家庭带来的温暖庇护。" },
      { id: 4, name: "THE FATHER", cnName: "皇帝 / 父亲", element: "詹姆·波特", meaning: "象征权威、秩序、保护与责任。代表建立规则、担当领袖以及提供坚实的后盾。" },
      { id: 5, name: "THE HIEROPHANT", cnName: "教皇", element: "阿不思·邓布利多", meaning: "象征传统、导师、精神领袖与高等智慧。代表在迷茫时寻找正确的指引、信仰与道德标准。" },
      { id: 6, name: "THE LOVERS", cnName: "恋人", element: "比尔·韦斯莱与芙蓉·德拉库尔", meaning: "象征真爱、结合、羁绊与重大选择。代表跨越外在阻碍与偏见的深厚情感，以及内心价值观的抉择。" },
      { id: 7, name: "THE CHARIOT", cnName: "战车", element: "飞天汽车与霍格沃茨特快列车", meaning: "象征意志力、冲破困境、胜利与掌控。即使途中有失控风险，依靠执念与决心仍能冲向终点。" },
      { id: 8, name: "JUSTICE", cnName: "正义", element: "分院帽", meaning: "象征公平、裁决、诚实与选择的后果。分院帽能看透人心本质，做出最公正无偏的归类与决定。" },
      { id: 9, name: "THE HERMIT", cnName: "隐士", element: "在黑暗储藏室孤身研究的西弗勒斯·斯内普", meaning: "象征内省、孤独的探索、深层思考与隐秘潜行。代表在孤独与误解中守护真相，向内寻求答案。" },
      { id: 10, name: "WHEEL OF FORTUNE", cnName: "命运之轮", element: "赫敏的时间转换器（Time-Turner）", meaning: "象征命运转折、时机、周期循环与不可逆的契机。代表命运齿轮的转动，带来变局与机遇。" },
      { id: 11, name: "STRENGTH", cnName: "力量", element: "莱姆斯·卢平与其身后的狼人阴影", meaning: "象征内在包容、温柔的克制、勇气与接纳。代表用理性和爱去驯服内心的欲望与阴暗面。" },
      { id: 12, name: "THE HANGED MAN", cnName: "倒吊人", element: "倒金钟咒（Levicorpus）", meaning: "象征换位思考、牺牲、等待与顺应困境。在被动或暂停的状态中，通过改变视角获得全新的领悟。" },
      { id: 13, name: "DEATH", cnName: "死神", element: "老魔杖与死亡圣器符号", meaning: "象征终结、彻底的变革、旧阶段结束与重生。并非指肉体死亡，而是旧模式的破除与新纪元的开启。" },
      { id: 14, name: "TEMPERANCE", cnName: "节制", element: "魔法石与炼金/熬制魔药", meaning: "象征平衡、调和、耐心与适度。如精妙的魔药炼制，需要精准把控比例与节奏，实现升华。" },
      { id: 15, name: "THE DEVIL", cnName: "恶魔", element: "伏地魔、纳吉尼与黑魔标记", meaning: "象征执念、欲望、束缚与恐惧。代表对力量或永生的病态追求所带来的自我奴役与陷井。" },
      { id: 16, name: "THE TOWER", cnName: "高塔", element: "被袭击和火光笼罩的霍格沃茨塔楼", meaning: "象征突如其来的剧变、破灭、虚幻规则的崩塌。虽然带来冲击，但也清除了旧有幻象，迎来重建。" },
      { id: 17, name: "THE STAR", cnName: "星星", element: "邓布利多留给罗恩的熄灯器（Deluminator）", meaning: "象征希望、指引、心灵抚慰与灵感。在最黑暗沉寂的时刻发出微光，指引重逢与前行的方向。" },
      { id: 18, name: "THE MOON", cnName: "月亮", element: "装满记忆银丝的冥想盆（Pensieve）", meaning: "象征潜意识、迷茫、隐秘与直觉。在波光粼粼的记忆迷雾中探寻被隐藏的真相与内在情绪。" },
      { id: 19, name: "THE SUN", cnName: "太阳", element: "哈利骑乘鹰头马身有翼兽巴克比克翱翔", meaning: "象征自由、活力、成功与光明。代表冲破阴霾后的无比畅快、生命力的绽放与正向能量。" },
      { id: 20, name: "JUDGEMENT", cnName: "审判", element: "凤凰福克斯（Fawkes）", meaning: "象征复苏、觉醒、灵魂救赎与召唤。如凤凰在灰烬中涅槃重获新生，代表重大转变与清算后的升华。" },
      { id: 21, name: "THE WORLD", cnName: "世界", element: "国王十字车站的白色迷蒙空间", meaning: "象征圆满、完美终结、达成与灵魂的升华。代表大阿卡纳旅程的最终站，迎来完满与新的轮回。" }
    ];

    // ====================================================
    // 2. 本地支付解锁逻辑
    // ====================================================
    let isPaid = localStorage.getItem('hp_tarot_paid') === 'true';

    // 点击“翻牌”入口函数
    function startFlipCard() {
      if (!isPaid) {
        // 未支付：展示微信支付弹窗
        document.getElementById('payModal').style.display = 'flex';
        return;
      }
      // 已支付：直接翻牌与展示解读
      executeFlipAndReading();
    }

    // 点击弹窗“我已支付”解锁按钮
    document.getElementById('confirmPayBtn').addEventListener('click', function() {
      isPaid = true;
      localStorage.setItem('hp_tarot_paid', 'true'); // 存入浏览器本地缓存
      document.getElementById('payModal').style.display = 'none'; // 关闭弹窗
      executeFlipAndReading(); // 触发翻牌
    });

    // ====================================================
    // 3. 抽牌与动画逻辑
    // ====================================================
    let isFlipping = false;

    function executeFlipAndReading() {
      if (isFlipping) return;
      isFlipping = true;

      const cardElem = document.getElementById('tarotCard');
      const readingBox = document.getElementById('readingBox');

      // 每次抽牌前重置正面
      cardElem.classList.remove('flipped');
      readingBox.style.display = 'none';

      // 随机抽取一张牌 (0 - 21)
      const randomCard = cards[Math.floor(Math.random() * cards.length)];

      setTimeout(() => {
        // 更新牌面元素
        document.getElementById('cardNumber').innerText = `NO. ${randomCard.id}`;
        document.getElementById('cardName').innerText = `${randomCard.name}\n(${randomCard.cnName})`;
        document.getElementById('cardElement').innerText = randomCard.element;

        // 更新解读面板文本
        document.getElementById('elementText').innerText = randomCard.element;
        document.getElementById('meaningText').innerText = randomCard.meaning;

        // 翻转牌面
        cardElem.classList.add('flipped');

        // 展示解读
        setTimeout(() => {
          readingBox.style.display = 'block';
          isFlipping = false;
        }, 600);
      }, 300);
    }
  </script>
</body>
</html>
